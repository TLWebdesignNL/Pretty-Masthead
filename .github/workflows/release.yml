name: Release

on:
  push:
    tags:
      - 'V*'

env:
  # Joomla versions offered this release, as a regex matched against JVERSION.
  # Must match the minimum in script.php (MINIMUM_JOOMLA): 5.4.x and 6.x.
  TARGETPLATFORM: '(5\.4|6\.[0-9]+)\..*'

jobs:
  update-xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version and build download URL
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#V}"
          ZIP_NAME="mod_prettymasthead-${VERSION}.zip"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "zip_url=${ZIP_URL}" >> $GITHUB_OUTPUT

      # Build the package from the tag; export-ignore rules in .gitattributes
      # keep repository-only files out of it.
      - name: Build package and compute SHA256
        id: sha256
        run: |
          git archive --format=zip -o "${{ steps.vars.outputs.zip_name }}" "${{ steps.vars.outputs.tag }}"
          SHA=$(sha256sum "${{ steps.vars.outputs.zip_name }}" | awk '{print $1}')
          echo "value=${SHA}" >> $GITHUB_OUTPUT

      # Publish the package before updates.xml points sites at it.
      - name: Create GitHub Release with the package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          ZIP_NAME: ${{ steps.vars.outputs.zip_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" --title "Pretty Masthead $VERSION" --generate-notes --verify-tag
          fi

      - name: Append entry to updates.xml
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ZIP_URL: ${{ steps.vars.outputs.zip_url }}
          SHA256: ${{ steps.sha256.outputs.value }}
          TARGETPLATFORM: ${{ env.TARGETPLATFORM }}
        run: |
          python3 - <<'EOF'
          import re, os

          version = os.environ["VERSION"]
          zip_url = os.environ["ZIP_URL"]
          sha256  = os.environ["SHA256"]
          repo    = os.environ["GITHUB_REPOSITORY"]
          platform = os.environ["TARGETPLATFORM"]

          if not re.fullmatch(r'[a-f0-9]{64}', sha256):
              raise SystemExit(f"Invalid SHA256 for release zip: {sha256!r}")

          with open("updates.xml", "r") as f:
              content = f.read()

          if f"<version>{version}</version>" in content:
              print(f"Version {version} already exists, skipping.")
              raise SystemExit(0)

          # Extract the last <update> block as a template
          blocks = re.findall(r'<update>.*?</update>', content, re.DOTALL)
          if not blocks:
              raise SystemExit("No existing <update> block found to use as template.")
          last = blocks[-1]

          # Set name, version, download URL and changelog URL explicitly; the download is the package attached to the GitHub Release
          changelog_url = f"https://raw.githubusercontent.com/{repo}/main/changelog.xml"

          new_block = re.sub(r'<name>[^<]*</name>', lambda m: f'<name>Pretty Masthead {version}</name>', last, count=1)
          new_block = re.sub(r'<version>[^<]*</version>', lambda m: f'<version>{version}</version>', new_block, count=1)
          new_block = re.sub(r'(<downloadurl\b[^>]*>)\s*[^<]*?\s*(</downloadurl>)',
                             lambda m: f'{m.group(1)}\n                {zip_url}\n            {m.group(2)}', new_block, count=1)
          new_block = re.sub(r'<changelogurl>[^<]*</changelogurl>', lambda m: f'<changelogurl>{changelog_url}</changelogurl>', new_block, count=1)

          if zip_url not in new_block or f'<version>{version}</version>' not in new_block:
              raise SystemExit("Could not set the download URL or version in the new update block.")

          # Update sha256 (also when the template's value is empty), or insert it
          sha_element = f'<sha256>{sha256}</sha256>'
          if re.search(r'<sha256>[a-f0-9]*</sha256>', new_block):
              new_block = re.sub(r'<sha256>[a-f0-9]*</sha256>', lambda m: sha_element, new_block)
          else:
              new_block = re.sub(r'(\s*)(</tags>)', lambda m: m.group(0) + m.group(1) + sha_element, new_block, count=1)

          # Set targetplatform explicitly instead of copying it from the template
          platform_element = f'<targetplatform name="joomla" version="{platform}"/>'
          if re.search(r'<targetplatform\b[^>]*/>', new_block):
              new_block = re.sub(r'<targetplatform\b[^>]*/>', lambda m: platform_element, new_block)
          else:
              new_block = re.sub(r'(\s*)(<client>)', lambda m: m.group(1) + platform_element + m.group(0), new_block, count=1)

          # Guard: the new entry must carry exactly one valid hash and the configured platform
          hashes = re.findall(r'<sha256>([^<]*)</sha256>', new_block)
          if hashes != [sha256]:
              raise SystemExit(f"New update block has invalid <sha256> element(s): {hashes!r}")
          if platform_element not in new_block:
              raise SystemExit("New update block has no <targetplatform> element.")

          # Detect indentation of the last block and match it
          indent = re.match(r'(\s*)', last).group(1)
          new_block = indent + new_block.lstrip()

          content = content.replace('</updates>', new_block + '\n</updates>')
          with open("updates.xml", "w") as f:
              f.write(content)
          print(f"Added version {version} (sha256: {sha256})")
          EOF

      - name: Commit and push updated updates.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: add updates.xml entry for ${{ steps.vars.outputs.tag }}"
          git push origin main
